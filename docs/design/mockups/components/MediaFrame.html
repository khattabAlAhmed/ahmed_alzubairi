<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<style>body{margin:0;background:var(--bg);color:var(--ink)}</style>
<script>if(/[?&]theme=dark/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-theme]').forEach(function(e){e.setAttribute('data-theme','dark')});document.documentElement.setAttribute('data-theme','dark')});</script><meta charset="utf-8"><title>Image, gallery and video — preview</title>
<style>
.sheet { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.sheet figure { display: flex; flex-direction: column; gap: 4px; }
.sheet figcaption { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
.video { position: relative; }
.video button { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; background: rgba(16, 18, 19, 0.45); color: #FFFFFF; font-size: 15px; cursor: pointer; }
.video button span.c { display: grid; place-content: center; width: 56px; height: 56px; border: 1.5px solid #FFFFFF; }
</style></head>
<body>
<div class="r pad" dir="rtl">
<div style="display: grid; grid-template-columns: 7fr 5fr; gap: 32px">
<div class="stack" style="gap: 8px">
<p class="r-label">معرض المشروع</p>
<div class="sheet">
<figure><img class="r-photo" style="aspect-ratio: 1 / 1" src="../../images/field-listening.jpg" alt="جلسة استماع"><figcaption><span>جلسة استماع</span><span class="mono" dir="ltr">01</span></figcaption></figure>
<figure><img class="r-photo" style="aspect-ratio: 1 / 1" src="../../images/workshop-facilitation.jpg" alt="ورشة التصميم"><figcaption><span>ورشة التصميم</span><span class="mono" dir="ltr">02</span></figcaption></figure>
<figure><img class="r-photo" style="aspect-ratio: 1 / 1" src="../../images/the-table.jpg" alt="غرفة الاجتماع"><figcaption><span>غرفة الاجتماع</span><span class="mono" dir="ltr">03</span></figcaption></figure>
<figure><div class="r-photo-missing" style="aspect-ratio: 1 / 1"><span>لم تُرفع بعد</span></div><figcaption><span>—</span><span class="mono" dir="ltr">04</span></figcaption></figure>
</div>
<p class="r-hint">الضغط على صورة يفتحها كاملة مع تعليقها، والأسهم تتنقل بينها. الأرقام ترتيب الصور فقط.</p>
</div>
<div class="stack" style="gap: 8px">
<p class="r-label">فيديو مضمّن</p>
<div class="video"><img class="r-photo" style="aspect-ratio: 16 / 9" src="../../images/ahmed-at-work.jpg" alt=""><button><span class="c"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l12 8-12 8z"/></svg></span>شغّل المقابلة · ٢٤ دقيقة</button></div>
<p class="r-hint">لا يُحمَّل المشغّل قبل الضغط (أخف على الشبكات الضعيفة). إن تعذّر التشغيل: رابط إلى الفيديو على موقعه.</p>
</div>
</div>
</div>
</body>
</html>
