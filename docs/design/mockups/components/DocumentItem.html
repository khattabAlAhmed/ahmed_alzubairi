<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<style>body{margin:0;background:var(--bg);color:var(--ink)}</style>
<script>if(/[?&]theme=dark/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-theme]').forEach(function(e){e.setAttribute('data-theme','dark')});document.documentElement.setAttribute('data-theme','dark')});</script><meta charset="utf-8"><title>Public document item — preview</title>
<style>
.dl { border-top: var(--rule-heavy) solid var(--rule); }
.dl label { display: grid; grid-template-columns: 24px 28px minmax(0, 1fr) 180px auto; gap: 16px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.dl label.is-selected { background: var(--accent-wash); }
.dl .r-check { gap: 0; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 16px; padding: 14px 18px; background: var(--ink); color: var(--bg); }
.bar .r-btn--primary { background: var(--bg); color: var(--ink); }
</style></head>
<body>
<div class="r pad" dir="rtl">
<div class="dl" role="group" aria-label="الوثائق">
<label class="is-selected"><span class="r-check"><input type="checkbox" checked aria-label="اختر"></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg><span class="ar-h3" style="font-size: 18px">رسالة شكر من منظمة دولية · برنامج الحماية</span><span class="ar-small muted">رسائل شكر وتوصية</span><span class="r-tag">٢٠٢٣</span></label>
<label class="is-selected"><span class="r-check"><input type="checkbox" checked aria-label="اختر"></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg><span class="ar-h3" style="font-size: 18px">شهادة خبرة · مستشار حوكمة</span><span class="ar-small muted">شهادات الخبرة</span><span class="r-tag">٢٠١٦</span></label>
<label><span class="r-check"><input type="checkbox" aria-label="اختر"></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg><span class="ar-h3" style="font-size: 18px">شهادة في الحماية الإنسانية</span><span class="ar-small muted">شهادات الدورات والمؤهلات</span><span class="r-tag">٢٠١٧</span></label>
<label><span class="r-check"><input type="checkbox" aria-label="اختر"></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg><span class="ar-h3" style="font-size: 18px">صور ورشة الإحالة المجتمعية</span><span class="ar-small muted">صور المشاريع والفعاليات</span><span class="r-tag">٢٠٢٢</span></label>
</div>
<div class="bar"><span class="ar-small">اخترت وثيقتين · يُفتح الطلب بعد تسجيل الدخول</span><button class="r-btn r-btn--primary r-btn--sm">طلب الاطلاع</button></div>
<p class="r-hint" style="margin-top: 12px">العنوان والتصنيف فقط، لا محتوى ولا معاينة. القفل يقول إن الوثيقة محمية. الطلب يذهب إلى أحمد ليقرر.</p>
</div>

</html>
