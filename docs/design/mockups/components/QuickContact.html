<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<style>body{margin:0;background:var(--bg);color:var(--ink)}</style>
<script>if(/[?&]theme=dark/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-theme]').forEach(function(e){e.setAttribute('data-theme','dark')});document.documentElement.setAttribute('data-theme','dark')});</script><meta charset="utf-8"><title>Quick contact — preview</title>
<style>
.qc-tab { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; background: var(--bg); border: 1px solid var(--line-strong); font-size: 14px; text-decoration: none; }
.qc { width: 320px; background: var(--bg); box-shadow: var(--shadow-overlay); border-top: var(--rule-heavy) solid var(--rule); }
.qc a { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); text-decoration: none; }
</style></head>
<body>
<div class="r pad" dir="rtl" style="display: flex; gap: 40px; align-items: flex-end">
<div class="stack" style="gap: 8px"><button class="qc-tab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 19l1.2-3.6A7.5 7.5 0 1 1 9 18.4z"/></svg>تواصل سريع</button><p class="state-label">مغلق · أسفل طرف البداية</p></div>
<div class="qc" role="dialog" aria-label="تواصل سريع">
<a href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 19l1.2-3.6A7.5 7.5 0 1 1 9 18.4z"/></svg><span><span class="ar-small" style="display: block; font-weight: 500">واتساب</span><span class="mono" dir="ltr" style="font-size: 13px; color: var(--ink-2)">+967 77 000 0000</span></span><svg class="dir-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg></a>
<div style="display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg><span><span class="ar-small" style="display: block; font-weight: 500">البريد</span><span class="mono" dir="ltr" style="font-size: 13px; color: var(--ink-2); user-select: all">hello@example.org</span></span><button class="r-btn r-btn--quiet r-btn--sm" style="min-height: 32px">انسخ</button></div>
<div style="padding: 14px 16px"><a href="#" class="r-btn r-btn--primary r-btn--block" style="display: flex; grid-template-columns: none; border: 0; padding: 0 24px">اطلب استشارة</a></div>
</div>
<p class="r-hint" style="max-width: 260px">العنوان والرقم يظهران نصاً يمكن نسخه، لأن روابط mailto وwa.me لا تعمل عند الجميع. لا وعد بزمن رد.</p>
</div>
</body>
</html>
