<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<style>body{margin:0;background:var(--bg);color:var(--ink)}</style>
<script>if(/[?&]theme=dark/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-theme]').forEach(function(e){e.setAttribute('data-theme','dark')});document.documentElement.setAttribute('data-theme','dark')});</script><meta charset="utf-8"><title>His sentence — preview</title>
<style>
.hs { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; padding-block: 48px; }
.hs blockquote { grid-column: 3 / span 8; font-size: 34px; line-height: 1.7; font-weight: 500; text-wrap: balance; }
.hs figcaption { grid-column: 3 / span 8; display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink-2); }
.hs figcaption::before { content: ""; width: 32px; border-top: var(--rule-heavy) solid var(--accent); }
.inline-s { display: grid; grid-template-columns: var(--label-col) minmax(0, 1fr); gap: 24px; padding-block: 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
</style></head>
<body>
<div class="r pad" dir="rtl">
<figure class="hs">
<blockquote>«لا أبحث عن الحل الأذكى. أبحث عن الحل الذي سيبقى بعد أن أغادر.»</blockquote>
<figcaption>أحمد</figcaption>
</figure>
<div class="inline-s"><p class="ar-small muted">بصوتي</p><p class="ar-h3" style="font-weight: 500">أعمل مع المؤسسات حين يصعب القرار، لا حين يسهل.</p></div>
<p class="r-hint" style="margin-top: 16px">نوعان: جملة كبيرة بين قسمين (مرة واحدة في الصفحة)، وسطر داخل السجل يحمل تسمية «بصوتي». بلا علامات تنصيص مزخرفة، بلا مائل، وبلا تلوين لكلمة. الخط القصير قبل الاسم هو الموضع الوحيد الذي يظهر فيه اللون المميز هنا.</p>
</div>
</body>
</html>
