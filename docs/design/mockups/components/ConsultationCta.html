<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<style>body{margin:0;background:var(--bg);color:var(--ink)}</style>
<script>if(/[?&]theme=dark/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-theme]').forEach(function(e){e.setAttribute('data-theme','dark')});document.documentElement.setAttribute('data-theme','dark')});</script><meta charset="utf-8"><title>Consultation call to action — preview</title>
<style>
.cta { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; padding-block: 28px; border-top: var(--rule-heavy) solid var(--rule); border-bottom: 1px solid var(--line); align-items: start; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.75; }
.steps li:first-child { border-top: 1px solid var(--line); }
.steps b { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink-2); }
</style></head>
<body>
<div class="r pad" dir="rtl">
<aside class="cta" aria-labelledby="cta1">
<img class="r-photo" style="grid-column: span 3; aspect-ratio: 3 / 2" src="../../images/the-table.jpg" alt="صورة مؤقتة: طاولة وكرسيان متقابلان قرب نافذة">
<div style="grid-column: span 5" class="stack">
<h2 id="cta1" class="ar-h2">أخبرني بما تواجهه.</h2>
<p class="ar-body muted" style="max-width: 30em">لا تحتاج إلى خطة جاهزة ولا إلى صيغة رسمية. اكتب ما يقلقك كما تشرحه لزميل، وسأقرأه بنفسي.</p>
<div class="row" style="margin-top: 6px"><a href="#" class="r-btn r-btn--primary">اطلب استشارة</a><a href="#" class="r-btn r-btn--quiet">أو راسلني مباشرة</a></div>
</div>
<ol class="steps" style="grid-column: span 4" aria-label="ماذا يحدث بعد ذلك">
<li><b>١</b><span>تكتب الطلب من حسابك، مع أي ملف يساعد.</span></li>
<li><b>٢</b><span>أقرأه وأرد عليك كتابةً في المحادثة نفسها.</span></li>
<li><b>٣</b><span>إذا احتجنا، نحدد اجتماعاً مرئياً في وقت يناسبك.</span></li>
</ol>
</aside>
</div>
</body>
</html>
