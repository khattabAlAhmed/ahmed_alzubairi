<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<style>body{margin:0;background:var(--bg);color:var(--ink)}</style>
<script>if(/[?&]theme=dark/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-theme]').forEach(function(e){e.setAttribute('data-theme','dark')});document.documentElement.setAttribute('data-theme','dark')});</script><meta charset="utf-8"><title>Skip link and consent — preview</title>
<style>
.skip { display: inline-block; padding: 12px 18px; background: var(--ink); color: var(--bg); font-size: 15px; text-decoration: none; outline: 2px solid var(--focus); outline-offset: 3px; }
.cb { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 16px 20px; background: var(--bg); border-top: var(--rule-heavy) solid var(--rule); box-shadow: var(--shadow-overlay); }
</style></head>
<body>
<div class="r pad" dir="rtl">
<div class="stack" style="gap: 28px">
<div class="stack" style="gap: 8px"><a href="#main" class="skip">انتقل إلى المحتوى</a><p class="state-label">يظهر عند أول Tab فقط، أعلى طرف البداية</p></div>
<div class="cb" role="region" aria-label="الخصوصية">
<div class="stack" style="gap: 2px"><p class="ar-small" style="font-weight: 500">أستعمل إحصاءات مجهولة لأعرف أي الصفحات تُقرأ.</p><p class="r-hint">لا أجمع اسمك ولا ما تكتبه. يمكنك تغيير رأيك من <a href="#" class="r-link">سياسة الخصوصية</a>.</p></div>
<div class="row"><button class="r-btn r-btn--secondary r-btn--sm">لا، شكراً</button><button class="r-btn r-btn--secondary r-btn--sm">موافق</button></div>
</div>
<p class="r-hint">الزران متساويان في الشكل والوزن: الرفض ليس أصعب من القبول. الشريط أسفل الصفحة ولا يحجب المحتوى.</p>
</div>
</div>
</body>
</html>
