<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<style>body{margin:0;background:var(--bg);color:var(--ink)}</style>
<script>if(/[?&]theme=dark/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-theme]').forEach(function(e){e.setAttribute('data-theme','dark')});document.documentElement.setAttribute('data-theme','dark')});</script><meta charset="utf-8"><title>Notice — preview</title></head>
<body>
<div class="r pad" dir="rtl">
<div class="grid-2" style="gap: 16px 24px">
<div class="r-notice r-notice--success" role="status"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true" style="margin-top: 5px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><div><p class="ar-small" style="font-weight: 500">حُفظت بياناتك</p><p class="r-hint">التغيير يظهر في رسائلك القادمة.</p></div><button class="r-icon-btn" aria-label="إغلاق" style="width: 32px; height: 32px; color: var(--ink-2)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="r-notice r-notice--info" role="status"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="margin-top: 5px"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><div><p class="ar-small" style="font-weight: 500">الأوقات بتوقيت مكة</p><p class="r-hint">غيّر المنطقة الزمنية من ملفك الشخصي.</p></div><span></span></div>
<div class="r-notice r-notice--warning" role="status"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="margin-top: 5px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><p class="ar-small" style="font-weight: 500">تنتهي إتاحة هذه الوثيقة بعد ٣ أيام</p><p class="r-hint">يمكنك طلبها مرة أخرى بعد ذلك.</p></div><span></span></div>
<div class="r-notice r-notice--danger" role="alert"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true" style="margin-top: 5px"><path d="M6 6l12 12M18 6L6 18"/></svg><div><p class="ar-small" style="font-weight: 500">لم تُرسل رسالتك</p><p class="r-hint">ما كتبته محفوظ. تحقق من الاتصال وأعد الإرسال.</p></div><button class="r-btn r-btn--quiet r-btn--sm">أعد الإرسال</button></div>
</div>
</div>
</body>
</html>
