<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<style>body{margin:0;background:var(--bg);color:var(--ink)}</style>
<script>if(/[?&]theme=dark/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-theme]').forEach(function(e){e.setAttribute('data-theme','dark')});document.documentElement.setAttribute('data-theme','dark')});</script><meta charset="utf-8"><title>Filter chips — preview</title></head>
<body>
<div class="r pad" dir="rtl">
<div class="stack" style="gap: 18px">
<div class="row" role="group" aria-label="مجال الخبرة" style="gap: 8px">
<span class="r-hint" style="min-width: 88px">المجال</span>
<button class="r-chip" aria-pressed="true"><span class="box"></span>الحوكمة<span class="n">١٤</span></button>
<button class="r-chip" aria-pressed="true"><span class="box"></span>العمل الإنساني<span class="n">١٧</span></button>
<button class="r-chip" aria-pressed="false"><span class="box"></span>التنمية<span class="n">٧</span></button>
</div>
<div class="row" role="group" aria-label="نوع الجهة" style="gap: 8px">
<span class="r-hint" style="min-width: 88px">نوع الجهة</span>
<button class="r-chip" aria-pressed="false"><span class="box"></span>حكومية<span class="n">٩</span></button>
<button class="r-chip" aria-pressed="false" style="outline: 2px solid var(--focus); outline-offset: 3px"><span class="box"></span>منظمة دولية<span class="n">٢٠</span></button>
<button class="r-chip" aria-pressed="false"><span class="box"></span>منظمة محلية<span class="n">٦</span></button>
<button class="r-chip" aria-pressed="false"><span class="box"></span>شركة<span class="n">٣</span></button>
</div>
<p class="r-hint">٣١ مشروعاً تطابق اختيارك · <a href="#" class="r-link">امسح الاختيار</a></p>
</div>
</div>
</body>
</html>
