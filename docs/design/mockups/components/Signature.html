<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<style>body{margin:0;background:var(--bg);color:var(--ink)}</style>
<script>if(/[?&]theme=dark/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-theme]').forEach(function(e){e.setAttribute('data-theme','dark')});document.documentElement.setAttribute('data-theme','dark')});</script><meta charset="utf-8"><title>Signature — preview</title>
<style>
.sg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-top: var(--rule-heavy) solid var(--rule); }
.sg > div { padding: 24px; display: flex; flex-direction: column; gap: 10px; }
.slot { width: 220px; height: 84px; border: 1.5px dashed currentColor; display: grid; place-content: center; font-size: 12px; text-align: center; line-height: 1.6; opacity: .8; }
</style></head>
<body>
<div class="r pad" dir="rtl">
<div class="sg">
<div style="background: #FFFFFF; color: #1A1C1E"><div class="slot">signature-ink.svg<br>حبر <span dir="ltr">#1A1C1E</span></div><p style="font-size: 13px; color: #50555A">الوضع الفاتح: حبر داكن على الأرضية البيضاء.</p></div>
<div style="background: #101213; color: #E6E8E9"><div class="slot">signature-light.svg<br>حبر <span dir="ltr">#E6E8E9</span></div><p style="font-size: 13px; color: #9DA3A7">الوضع الداكن: نسخة فاتحة، لا عكس ألوان آلي.</p></div>
</div>
<p class="r-hint" style="margin-top: 14px">يُمسح التوقيع من الورق بدقة ٦٠٠ نقطة، ويُحوَّل إلى SVG بلون واحد بخلفية شفافة، بعرض ٢٠٠ إلى ٢٤٠. له وصف بديل «توقيع أحمد». يظهر تحت الرسالة فقط.</p>
</div>
</body>
</html>
