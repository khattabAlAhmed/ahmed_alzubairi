<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<style>body{margin:0;background:var(--bg);color:var(--ink)}</style>
<script>if(/[?&]theme=dark/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-theme]').forEach(function(e){e.setAttribute('data-theme','dark')});document.documentElement.setAttribute('data-theme','dark')});</script><meta charset="utf-8"><title>FAQ — preview</title>
<style>
.fq { display: grid; grid-template-columns: 3fr 9fr; gap: 32px; }
.fq nav { border-top: var(--rule-heavy) solid var(--rule); }
.fq nav a { display: flex; justify-content: space-between; padding-block: 10px; border-bottom: 1px solid var(--line); font-size: 15px; text-decoration: none; color: var(--ink-2); }
.fq nav a[aria-current="true"] { color: var(--ink); font-weight: 500; }
.qs { border-top: var(--rule-heavy) solid var(--rule); }
.qs details { border-bottom: 1px solid var(--line); }
.qs summary { display: grid; grid-template-columns: minmax(0, 1fr) 24px; gap: 16px; align-items: center; padding-block: 16px; cursor: pointer; list-style: none; font-size: 19px; font-weight: 500; line-height: 1.7; }
.qs summary::-webkit-details-marker { display: none; }
.qs summary .pm { position: relative; width: 16px; height: 16px; }
.qs summary .pm::before, .qs summary .pm::after { content: ""; position: absolute; inset-inline: 0; top: 7px; border-top: 1.5px solid currentColor; }
.qs summary .pm::after { transform: rotate(90deg); transition: transform .2s ease; }
.qs details[open] summary .pm::after { transform: rotate(0); }
.qs .a { padding: 0 0 20px; max-width: var(--measure-ar); display: flex; flex-direction: column; gap: 10px; }
</style></head>
<body>
<div class="r pad" dir="rtl">
<div class="fq">
<nav aria-label="أقسام الأسئلة"><a href="#" aria-current="true">الاستشارات <span class="tnum">٦</span></a><a href="#">التدريب <span class="tnum">٤</span></a><a href="#">الوثائق <span class="tnum">٣</span></a><a href="#">الحساب <span class="tnum">٥</span></a></nav>
<div class="qs">
<details open><summary>هل تُدفع الاستشارة من خلال الموقع؟<span class="pm" aria-hidden="true"></span></summary><div class="a"><p class="ar-body">لا. الموقع للتواصل فقط. نتفق على كل شيء كتابةً في المحادثة قبل أي التزام.</p><a href="#" class="r-more" style="align-self: flex-start">الاستشارات الإدارية</a></div></details>
<details><summary>كم يستغرق الرد على طلبي؟<span class="pm" aria-hidden="true"></span></summary></details>
<details><summary>هل يمكن أن يبقى اسم جهتنا سرّياً؟<span class="pm" aria-hidden="true"></span></summary></details>
<details><summary>هل تعمل خارج المنطقة العربية؟<span class="pm" aria-hidden="true"></span></summary></details>
</div>
</div>
</div>
</body>
</html>
