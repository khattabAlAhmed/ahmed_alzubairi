<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<style>body{margin:0;background:var(--bg);color:var(--ink)}</style>
<script>if(/[?&]theme=dark/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-theme]').forEach(function(e){e.setAttribute('data-theme','dark')});document.documentElement.setAttribute('data-theme','dark')});</script><meta charset="utf-8"><title>Photography — preview</title></head>
<body>
<div class="r pad" dir="rtl">
<div style="display: grid; grid-template-columns: 1fr 1.5fr 1fr 1.6fr; gap: 24px; align-items: end">
<figure><img class="r-photo" style="aspect-ratio: 4 / 5" src="../../images/ahmed-portrait.jpg" alt="صورة مؤقتة لأحمد جالساً إلى طاولة"><figcaption class="r-caption"><span>أحمد · صورة مؤقتة</span><span class="mono" dir="ltr">4:5</span></figcaption></figure>
<figure><img class="r-photo" style="aspect-ratio: 3 / 2" src="../../images/field-listening.jpg" alt="صورة مؤقتة: سيدة تشرح لرجل يستمع"><figcaption class="r-caption"><span>جلسة استماع · مجتمع مضيف</span><span class="mono" dir="ltr">3:2</span></figcaption></figure>
<figure><img class="r-photo" style="aspect-ratio: 1 / 1" src="../../images/hands-notes.jpg" alt="صورة مؤقتة: يدان تكتبان في دفتر"><figcaption class="r-caption"><span>دفتر العمل</span><span class="mono" dir="ltr">1:1</span></figcaption></figure>
<figure><div class="r-photo-missing" style="aspect-ratio: 16 / 9"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="margin-inline: auto"><path d="M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4"/></svg><span>لا توجد صورة لهذا المشروع</span></div><figcaption class="r-caption"><span>حالة الصورة المفقودة</span><span class="mono" dir="ltr">16:9</span></figcaption></figure>
</div>
<p class="r-hint" style="margin-top: 16px">الصورة بلا زوايا ولا إطار ولا ظل، وبألوانها الحقيقية. تحتها سطر بيانات: من أو أين، والمقاس. الناس يظهرون وهم يعملون أو يتحدثون أو يستمعون، لا كموضوع للشفقة.</p>
</div>
</body>
</html>
