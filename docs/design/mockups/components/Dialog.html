<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<style>body{margin:0;background:var(--bg);color:var(--ink)}</style>
<script>if(/[?&]theme=dark/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-theme]').forEach(function(e){e.setAttribute('data-theme','dark')});document.documentElement.setAttribute('data-theme','dark')});</script><meta charset="utf-8"><title>Dialog — preview</title>
<style>
.stage { position: relative; padding: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
.stage::before { content: ""; position: absolute; inset: 0; background: var(--scrim); }
.d { position: relative; }
.d .b { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.d footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
</style></head>
<body>
<div class="r" dir="rtl">
<div class="stage">
<div class="d r-dialog" role="dialog" aria-modal="true" aria-labelledby="d1"><div class="b"><h2 id="d1" class="ar-h3">إغلاق الاستشارة؟</h2><p class="ar-small">تبقى المحادثة والملفات في سجلّك وسجلّ العميل. يمكن فتحها لاحقاً.</p></div><footer><button class="r-btn r-btn--quiet">رجوع</button><button class="r-btn r-btn--primary">أغلق الاستشارة</button></footer></div>
<div class="d r-dialog" role="alertdialog" aria-modal="true" aria-labelledby="d2" style="border-top-color: var(--danger)"><div class="b"><p class="state-label">الخطوة ٢ من ٢</p><h2 id="d2" class="ar-h3">حذف المحادثة نهائياً</h2><p class="ar-small">ستُحذف ٤٢ رسالة و٧ ملفات، ولا يمكن استعادتها. يُسجَّل الحذف باسمك.</p><div class="r-field"><label class="r-label" for="dd">اكتب «احذف» للتأكيد</label><input class="r-input" id="dd" value="احذ"></div></div><footer><button class="r-btn r-btn--quiet">إلغاء</button><button class="r-btn r-btn--danger" disabled>احذف نهائياً</button></footer></div>
</div>
</div>
</body>
</html>
