<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<style>body{margin:0;background:var(--bg);color:var(--ink)}</style>
<script>if(/[?&]theme=dark/.test(location.search))document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-theme]').forEach(function(e){e.setAttribute('data-theme','dark')});document.documentElement.setAttribute('data-theme','dark')});</script><meta charset="utf-8"><title>Skeleton — preview</title></head>
<body>
<div class="r pad" dir="rtl" aria-busy="true" aria-label="جارٍ التحميل">
<div class="grid-3">
<div class="r-record" aria-hidden="true">
<div class="r-record__meta"><span class="r-skel-line" style="width: 30%"></span><span class="r-skel-line" style="width: 20%"></span></div>
<div style="padding-block: 18px"><div class="r-skel-line" style="height: 20px; width: 80%"></div></div>
<div class="r-record__row"><span class="r-skel-line" style="width: 60%"></span><span class="r-skel-line"></span></div>
<div class="r-record__row"><span class="r-skel-line" style="width: 60%"></span><span class="r-skel-line" style="width: 85%"></span></div>
</div>
<div class="stack" aria-hidden="true" style="gap: 0; border-top: 1px solid var(--line)">
<div style="display: grid; grid-template-columns: 72px 1fr; gap: 16px; padding-block: 16px; border-bottom: 1px solid var(--line)"><span class="r-skel-line"></span><span class="r-skel-line" style="width: 90%"></span></div>
<div style="display: grid; grid-template-columns: 72px 1fr; gap: 16px; padding-block: 16px; border-bottom: 1px solid var(--line)"><span class="r-skel-line"></span><span class="r-skel-line" style="width: 70%"></span></div>
<div style="display: grid; grid-template-columns: 72px 1fr; gap: 16px; padding-block: 16px; border-bottom: 1px solid var(--line)"><span class="r-skel-line"></span><span class="r-skel-line" style="width: 80%"></span></div>
</div>
<div class="stack" aria-hidden="true" style="gap: 10px"><div class="r-skel" style="aspect-ratio: 3 / 2"></div><span class="r-skel-line" style="width: 40%"></span><span class="r-skel-line" style="height: 18px; width: 75%"></span></div>
</div>
<p class="r-hint" style="margin-top: 14px">الهيكل يأخذ شكل ما سيظهر بالضبط، بلون <span class="mono" dir="ltr">surface</span>. نبض بطيء يتوقف مع «تقليل الحركة».</p>
</div>
</body>
</html>
